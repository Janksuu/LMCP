<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LMCP Console</title>
<style>
/* ─── Tokens ───────────────────────────────────────────── */
:root {
  --bg-0: #0b0c0e;
  --bg-1: #111315;
  --bg-2: #17191c;
  --bg-3: #1f2226;
  --line: #24272b;
  --line-soft: #1b1d20;
  --fg-0: #e6e8ea;
  --fg-1: #b8bcc1;
  --fg-2: #7c8288;
  --fg-3: #565b61;
  --amber: #e3a44a;
  --amber-dim: #8a6128;
  --amber-ink: #1a140a;
  --green: #6ea26e;
  --red: #b46a66;
  --blue: #6f92b7;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg-0); color: var(--fg-0);
  font-family: var(--sans); font-size: 13px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  height: 100vh; overflow: hidden;
}
.mono { font-family: var(--mono); }
.k { color: var(--fg-2); text-transform: uppercase; letter-spacing: 0.14em; font-size: 10px; }
.muted { color: var(--fg-2); }
.dim { color: var(--fg-3); }
button { font-family: inherit; }
input, select { font-family: inherit; }

/* ─── Layout ───────────────────────────────────────────── */
#app {
  display: grid;
  grid-template-rows: 44px 1fr 28px;
  grid-template-columns: 56px 1fr 340px;
  height: 100vh;
}
#topbar    { grid-column: 1 / -1; }
#navrail   { grid-row: 2; grid-column: 1; }
#main      { grid-row: 2; grid-column: 2; min-width: 0; overflow: hidden; display: grid; grid-template-rows: 1fr auto; }
#eventsrail{ grid-row: 2; grid-column: 3; border-left: 1px solid var(--line); background: var(--bg-1); min-width: 0; display: flex; flex-direction: column; }
#statusbar { grid-column: 1 / -1; }

/* ─── Top bar ──────────────────────────────────────────── */
#topbar {
  background: var(--bg-1); border-bottom: 1px solid var(--line);
  display: flex; align-items: stretch; font-size: 12px;
}
.tb-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 0 16px; border-right: 1px solid var(--line); min-width: 56px;
}
.tb-mark { width: 14px; height: 14px; border: 1.5px solid var(--amber); transform: rotate(45deg); }
.tb-name { letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; font-size: 11px; }
.tb-ver { color: var(--fg-2); font-family: var(--mono); font-size: 11px; }
.tb-item {
  display: flex; align-items: center; gap: 8px;
  padding: 0 16px; border-right: 1px solid var(--line); color: var(--fg-1);
}
.tb-label { color: var(--fg-2); text-transform: uppercase; letter-spacing: 0.1em; font-size: 10px; }
.tb-val { color: var(--fg-0); font-family: var(--mono); font-size: 11px; }
.tb-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-3); display: inline-block; }
.tb-dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); }
.tb-dot.down { background: var(--red); box-shadow: 0 0 6px var(--red); }
.tb-spacer { flex: 1; }
.tb-right { display: flex; align-items: stretch; }
.tb-right .tb-item { border-right: none; border-left: 1px solid var(--line); }
.mode-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px;
  border: 1px solid var(--line);
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--fg-1); background: var(--bg-2);
}
.mode-pill.unlocked { color: var(--amber); border-color: var(--amber-dim); }
.btn {
  padding: 4px 10px; font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.12em; text-transform: uppercase;
  border: 1px solid var(--line); background: var(--bg-2); color: var(--fg-1);
  cursor: pointer;
}
.btn:hover { color: var(--fg-0); border-color: var(--fg-3); background: var(--bg-3); }
.btn.amber { color: var(--amber); border-color: var(--amber-dim); }
.btn.amber:hover { background: rgba(227,164,74,0.08); border-color: var(--amber); }
.btn.amber-solid { color: var(--amber-ink); background: var(--amber); border-color: var(--amber); }
.btn.amber-solid:hover { background: #f2b55d; }
.btn.danger { color: var(--red); border-color: #6b3938; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ─── Nav rail ─────────────────────────────────────────── */
#navrail { background: var(--bg-1); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.nav-item {
  height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; color: var(--fg-2); cursor: pointer; position: relative;
  border-bottom: 1px solid var(--line-soft);
}
.nav-item:hover { color: var(--fg-0); background: var(--bg-2); }
.nav-item.active { color: var(--fg-0); background: var(--bg-2); }
.nav-item.active::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--amber);
}
.nav-glyph { font-family: var(--mono); font-size: 15px; }
.nav-lbl { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; }
.nav-badge {
  position: absolute; top: 8px; right: 8px;
  font-family: var(--mono); font-size: 9px; min-width: 14px; height: 14px; padding: 0 3px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--amber); color: var(--amber-ink);
}

/* ─── Status bar ───────────────────────────────────────── */
#statusbar {
  background: var(--bg-1); border-top: 1px solid var(--line);
  display: flex; align-items: center; padding: 0 12px; gap: 20px;
  font-family: var(--mono); font-size: 11px; color: var(--fg-2);
}
.sep { width: 1px; height: 14px; background: var(--line); }
.spin { width: 6px; height: 6px; background: var(--amber); display: inline-block; animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
#statusbar .right { margin-left: auto; display: flex; gap: 20px; }

/* ─── Section header ───────────────────────────────────── */
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 14px 20px 10px; border-bottom: 1px solid var(--line);
}
.section-title {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--fg-1); font-weight: 500;
}
.section-id { font-family: var(--mono); font-size: 10px; color: var(--fg-3); }

/* ─── Main content ─────────────────────────────────────── */
#main-content { overflow-y: auto; padding: 20px; }

/* ─── Permission matrix ────────────────────────────────── */
.matrix-wrap { border: 1px solid var(--line); background: var(--bg-0); overflow: auto; }
.matrix { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
.matrix th, .matrix td {
  border-right: 1px solid var(--line-soft);
  border-bottom: 1px solid var(--line-soft);
  padding: 10px 12px; text-align: center; vertical-align: middle;
}
.matrix th {
  background: var(--bg-1); color: var(--fg-1); font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.1em; font-size: 10px;
  position: sticky; top: 0; z-index: 1;
}
.matrix th.sv { font-family: var(--mono); font-size: 11px; color: var(--fg-0); text-transform: none; letter-spacing: 0; }
.matrix td.client-cell {
  text-align: left; background: var(--bg-1);
  position: sticky; left: 0; z-index: 1;
  border-right: 1px solid var(--line);
}
.matrix td.client-cell .cid { color: var(--fg-0); font-size: 13px; }
.matrix td.client-cell .cmeta { color: var(--fg-2); font-size: 10px; margin-top: 2px; display: flex; gap: 10px; }
.matrix td.client-cell .token-pill {
  display: inline-block; font-size: 9px; letter-spacing: 0.1em; padding: 1px 5px;
  border: 1px solid var(--line); color: var(--fg-2);
}
.matrix td.client-cell .token-pill.set { color: var(--green); border-color: #35523a; }
.matrix td.client-cell .token-pill.placeholder { color: var(--amber); border-color: var(--amber-dim); }
.matrix td.client-cell .token-pill.empty { color: var(--red); border-color: #6b3938; }
.matrix th.server-head { text-align: left; padding: 10px 12px; min-width: 140px; }
.matrix th.server-head .sid { color: var(--fg-0); font-family: var(--mono); font-size: 12px; text-transform: none; letter-spacing: 0; }
.matrix th.server-head .smeta { color: var(--fg-2); font-size: 9px; margin-top: 2px; font-weight: 400; }
.matrix th.server-head .stransport { color: var(--blue); font-size: 9px; letter-spacing: 0.08em; }

.cell-btn {
  width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); background: var(--bg-1);
  cursor: pointer; color: var(--fg-3); font-family: var(--mono); font-size: 14px;
}
.cell-btn.on { background: rgba(227,164,74,0.12); border-color: var(--amber-dim); color: var(--amber); }
.cell-btn.on.dirty { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
.cell-btn.off.dirty { border-style: dashed; border-color: var(--amber); color: var(--amber); }
.cell-btn.locked { cursor: not-allowed; opacity: 0.7; }
.cell-btn.locked:hover::after {
  content: 'read-only'; position: absolute; transform: translate(16px, 16px);
  background: var(--bg-3); color: var(--fg-1); padding: 3px 8px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  border: 1px solid var(--line); z-index: 10; white-space: nowrap;
}
.cell-btn:not(.locked):hover { color: var(--amber); }

/* ─── Panel cards ──────────────────────────────────────── */
.panel-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
.panel {
  border: 1px solid var(--line); background: var(--bg-0);
  display: flex; flex-direction: column; min-height: 0;
}
.panel-head {
  padding: 10px 14px; border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: baseline;
}
.panel-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--fg-1); font-weight: 500; }
.panel-sub { font-family: var(--mono); font-size: 10px; color: var(--fg-3); }
.panel-body { padding: 4px 0; }

/* ─── List rows (client/server) ────────────────────────── */
.list-row {
  padding: 10px 14px; border-bottom: 1px solid var(--line-soft);
  cursor: pointer;
}
.list-row:hover { background: var(--bg-1); }
.list-row:last-child { border-bottom: none; }
.list-row.expanded { background: var(--bg-1); border-bottom: 1px solid var(--line); }
.row-head { display: flex; align-items: center; gap: 10px; }
.row-id { font-family: var(--mono); font-size: 13px; color: var(--fg-0); }
.row-meta { display: flex; gap: 10px; margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--fg-2); }
.row-detail { padding-top: 10px; margin-top: 8px; border-top: 1px solid var(--line-soft); font-family: var(--mono); font-size: 11px; color: var(--fg-1); }
.row-detail dl { display: grid; grid-template-columns: 120px 1fr; gap: 4px 14px; margin: 0; }
.row-detail dt { color: var(--fg-2); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; padding-top: 2px; }
.row-detail dd { margin: 0; color: var(--fg-0); word-break: break-all; }
.row-detail dd.locked-field {
  color: var(--fg-2); font-style: italic;
}
.row-detail .actions { display: flex; gap: 6px; margin-top: 12px; }
.inline-input {
  background: var(--bg-2); border: 1px solid var(--line); color: var(--fg-0);
  font-family: var(--mono); font-size: 11px; padding: 3px 6px;
}
.inline-input:focus { outline: none; border-color: var(--amber-dim); }
.inline-select {
  background: var(--bg-2); border: 1px solid var(--line); color: var(--fg-0);
  font-family: var(--mono); font-size: 11px; padding: 3px 6px;
}

/* ─── Events rail ──────────────────────────────────────── */
#eventsrail .section-head { padding: 14px 16px 10px; }
.events-controls { padding: 8px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.events-controls select {
  flex: 1;
  background: var(--bg-2); border: 1px solid var(--line); color: var(--fg-1);
  font-family: var(--mono); font-size: 10px; padding: 3px 6px; text-transform: uppercase; letter-spacing: 0.08em;
}
.events-list { flex: 1; overflow-y: auto; font-family: var(--mono); font-size: 11px; }
.event-row {
  padding: 8px 16px; border-bottom: 1px solid var(--line-soft);
  display: grid; grid-template-columns: 56px 1fr; gap: 10px;
  align-items: start;
}
.event-row.own { background: rgba(227,164,74,0.04); border-left: 2px solid var(--amber-dim); padding-left: 14px; }
.event-ts { color: var(--fg-3); font-size: 10px; padding-top: 1px; }
.event-type {
  font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em;
  padding: 1px 5px; border: 1px solid var(--line); color: var(--fg-2);
  display: inline-block; margin-bottom: 3px;
}
.event-type.allowed { color: var(--green); border-color: #35523a; }
.event-type.denied { color: var(--red); border-color: #6b3938; }
.event-type.rate_limited { color: var(--amber); border-color: var(--amber-dim); }
.event-type.config_change { color: var(--amber); border-color: var(--amber); background: rgba(227,164,74,0.08); }
.event-type.server_error { color: var(--red); border-color: #6b3938; }
.event-detail { font-size: 11px; color: var(--fg-1); line-height: 1.4; }
.event-detail .eid { color: var(--fg-0); }
.event-detail .reason { color: var(--fg-2); font-style: italic; }
.events-empty { padding: 40px 20px; color: var(--fg-3); text-align: center; font-family: var(--mono); font-size: 11px; }

/* ─── Pending changes docked bar ───────────────────────── */
#pending-bar {
  background: var(--bg-1); border-top: 1px solid var(--amber-dim);
  display: none;
  grid-template-columns: auto 1fr auto;
  gap: 20px; padding: 10px 20px; align-items: center;
}
#pending-bar.visible { display: grid; }
#pending-bar.error { border-top-color: var(--red); }
#pending-bar.warning { border-top-color: var(--amber); }
.pending-label {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--amber);
}
.pending-label.error { color: var(--red); }
.pending-summary {
  font-family: var(--mono); font-size: 12px; color: var(--fg-0);
  display: flex; gap: 14px; flex-wrap: wrap;
}
.pending-summary .tag { color: var(--fg-2); }
.pending-summary .amber { color: var(--amber); }
.pending-summary .red { color: var(--red); }
.pending-actions { display: flex; gap: 8px; }
.pending-errors {
  grid-column: 1 / -1; margin-top: 8px; padding: 10px 12px;
  background: rgba(180,106,102,0.08); border: 1px solid #6b3938;
  font-family: var(--mono); font-size: 11px; color: var(--red);
}
.pending-errors ul { margin: 6px 0 0; padding-left: 20px; color: var(--fg-1); }

/* ─── Modal ────────────────────────────────────────────── */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
}
.modal {
  background: var(--bg-0); border: 1px solid var(--line);
  min-width: 480px; max-width: 720px; max-height: 80vh;
  display: flex; flex-direction: column;
}
.modal-head {
  padding: 14px 20px; border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center;
}
.modal-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--fg-0); }
.modal-close { color: var(--fg-2); cursor: pointer; font-family: var(--mono); font-size: 14px; }
.modal-body { padding: 20px; overflow-y: auto; }
.modal-foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
.diff-list { font-family: var(--mono); font-size: 12px; }
.diff-item { padding: 6px 0; border-bottom: 1px solid var(--line-soft); display: grid; grid-template-columns: 20px 1fr; gap: 10px; }
.diff-item.add { color: var(--green); }
.diff-item.rem { color: var(--red); }
.diff-item.mod { color: var(--amber); }
.diff-item .glyph { font-weight: 600; }
details summary { cursor: pointer; font-family: var(--mono); font-size: 10px; color: var(--fg-2); text-transform: uppercase; letter-spacing: 0.12em; margin-top: 14px; }
details[open] summary { color: var(--fg-0); }
.raw-patch { margin-top: 8px; padding: 12px; background: var(--bg-1); border: 1px solid var(--line-soft); font-family: var(--mono); font-size: 11px; color: var(--fg-1); white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto; }

/* ─── Toast ─────────────────────────────────────────────── */
#toast {
  position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
  padding: 10px 18px; background: var(--bg-1); border: 1px solid var(--line);
  font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em;
  z-index: 200; display: none;
}
#toast.visible { display: block; }
#toast.ok { border-color: #35523a; color: var(--green); }
#toast.err { border-color: #6b3938; color: var(--red); }
#toast.warn { border-color: var(--amber-dim); color: var(--amber); }

/* ─── Utility ──────────────────────────────────────────── */
.scroll::-webkit-scrollbar { width: 8px; height: 8px; }
.scroll::-webkit-scrollbar-track { background: var(--bg-0); }
.scroll::-webkit-scrollbar-thumb { background: var(--bg-3); }
.empty-state {
  padding: 60px 20px; text-align: center;
  color: var(--fg-3); font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.12em; text-transform: uppercase;
}
</style>
</head>
<body>

<div id="app">
  <!-- Top bar -->
  <div id="topbar">
    <div class="tb-brand">
      <div class="tb-mark"></div>
      <div class="tb-name">LMCP</div>
      <span class="tb-ver" id="tb-version">v3</span>
    </div>
    <div class="tb-item">
      <span class="tb-label">Daemon</span>
      <span class="tb-dot" id="tb-dot"></span>
      <span class="tb-val" id="tb-host">—</span>
    </div>
    <div class="tb-item">
      <span class="tb-label">Uptime</span>
      <span class="tb-val" id="tb-uptime">—</span>
    </div>
    <div class="tb-item">
      <span class="tb-label">Clients</span>
      <span class="tb-val" id="tb-clients">0</span>
      <span class="tb-label">Servers</span>
      <span class="tb-val" id="tb-servers">0</span>
    </div>
    <div class="tb-spacer"></div>
    <div class="tb-right">
      <div class="tb-item">
        <span class="tb-label">Mode</span>
        <span class="mode-pill" id="mode-pill">● read-only</span>
      </div>
      <div class="tb-item">
        <button class="btn amber" id="btn-unlock">Unlock management</button>
      </div>
    </div>
  </div>

  <!-- Nav rail -->
  <div id="navrail">
    <div class="nav-item active" data-nav="matrix">
      <span class="nav-glyph">◫</span><span class="nav-lbl">Matrix</span>
    </div>
    <div class="nav-item" data-nav="clients">
      <span class="nav-glyph">◎</span><span class="nav-lbl">Clients</span>
    </div>
    <div class="nav-item" data-nav="servers">
      <span class="nav-glyph">⚙</span><span class="nav-lbl">Servers</span>
    </div>
    <div class="nav-item" data-nav="settings">
      <span class="nav-glyph">≡</span><span class="nav-lbl">Info</span>
    </div>
  </div>

  <!-- Main -->
  <div id="main">
    <div id="main-content" class="scroll"></div>
    <div id="pending-bar"></div>
  </div>

  <!-- Events rail -->
  <div id="eventsrail">
    <div class="section-head">
      <span class="section-title">Live events</span>
      <span class="section-id" id="sse-state">disconnected</span>
    </div>
    <div class="events-controls">
      <select id="event-filter">
        <option value="">all event types</option>
        <option value="client_auth">client_auth</option>
        <option value="server_auth">server_auth</option>
        <option value="rate_limited">rate_limited</option>
        <option value="config_change">config_change</option>
        <option value="server_error">server_error</option>
        <option value="tool_call">tool_call</option>
        <option value="tool_result">tool_result</option>
      </select>
      <button class="btn" id="btn-clear-events">Clear</button>
    </div>
    <div class="events-list scroll" id="events-list">
      <div class="events-empty">waiting for events…</div>
    </div>
  </div>

  <!-- Status bar -->
  <div id="statusbar">
    <span><span class="spin"></span> event bus</span>
    <span class="sep"></span>
    <span>/status <span id="sb-status-state" style="color: var(--fg-0)">—</span></span>
    <span class="sep"></span>
    <span>/events <span id="sb-events-state" style="color: var(--fg-0)">—</span></span>
    <span class="sep"></span>
    <span>status_version <span id="sb-statusver" style="color: var(--fg-0)">—</span></span>
    <div class="right">
      <span>registry <span id="sb-registry" style="color: var(--fg-0)">—</span></span>
      <span class="sep"></span>
      <span>lmcp-v3 · management api</span>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="ui.js"></script>
</body>
</html>
